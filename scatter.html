<!doctype html><html><head><meta charset="utf-8">
<title>Embedding · UNI-v2 explorer</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script></head>
<body><header>
  <h1>Mouse melanoma · UNI-v2 explorer</h1>
  <nav class="crumbs"><a href="index.html">Home</a><a href="scatter.html">Embedding</a><a href="similarity.html">Similarity</a></nav>
  <span class="banner">Preliminary · n = 2 mice/arm · hypothesis-generating, not statistically powered</span>
</header>
<div class="controls" style="padding:8px 18px;border-bottom:1px solid #eee">
  <span><label>Embedding</label>
    <select id="emb"><option value="umap">UMAP</option><option value="tsne">t-SNE</option></select></span>
  <span><label>Colour by</label>
    <select id="mode"><option value="arm">Treatment arm</option><option value="cluster">Cluster</option></select></span>
  <span><label>Overlay</label>
    <input id="heatAlpha" type="range" min="0" max="1" step="0.05" value="0.65" style="vertical-align:middle;width:90px"></span>
  <span style="color:#999;font-size:12px">hover a dot → tile image (top-right) + its location lights up on that mouse's heatmap (bottom-right)</span>
</div>
<div class="layout">
  <div id="plot" class="plotbig"></div>
  <div class="toppanel">
    <div id="preview" class="tile" style="width:150px;height:150px;flex:0 0 150px"></div>
    <div id="info" class="kv" style="color:#999">Hover a point…</div>
  </div>
  <div id="heatgrid" class="heatgrid"></div>
</div>
<script src="app.js"></script>
<script>
let M, HM, GD=document.getElementById("plot"), lastGi=null, panels={};
const elPrev=document.getElementById("preview"), elInfo=document.getElementById("info"),
      elGrid=document.getElementById("heatgrid"), elAlpha=document.getElementById("heatAlpha");
function buildTraces(mode, emb){
  const [X,Y]=embXY(M,emb), tr=[];
  const groups = mode==="arm" ? ARM_ORDER : [...Array(kOf(M)).keys()];
  for(const g of groups){
    const xs=[],ys=[],cd=[];
    for(let i=0;i<M.n;i++){
      const match = mode==="arm" ? M.arms[i]===g : M.cluster[i]===g;
      if(match){ xs.push(X[i]); ys.push(Y[i]); cd.push(i); }
    }
    tr.push({x:xs,y:ys,customdata:cd,mode:"markers",type:"scattergl",
      name: mode==="arm"? g : "C"+g,
      marker:{size:3.2,opacity:0.62, color: mode==="arm"? armColor(g): clusterColor(g)}});
  }
  return tr;
}
const LAYOUT={hovermode:"closest",margin:{l:8,r:8,t:8,b:8},
  xaxis:{visible:false},yaxis:{visible:false},
  legend:{itemsizing:"constant",font:{size:11}},dragmode:"pan"};
function draw(){
  Plotly.react(GD, buildTraces(document.getElementById("mode").value,
    document.getElementById("emb").value), LAYOUT,
    {responsive:true,scrollZoom:true,displaylogo:false});
}
// build all four heatmap panels once (no jumping)
function buildHeatmaps(){
  const order = Object.keys(HM).sort((a,b)=>
    HM[a].arm===HM[b].arm ? a.localeCompare(b) : (HM[a].arm==="Vehicle"?-1:1));
  for(const m of order){
    const g=HM[m];
    const panel=document.createElement("div"); panel.className="hpanel";
    panel.style.setProperty("--hl", armColor(g.arm));
    const lab=document.createElement("div"); lab.className="hlabel";
    lab.innerHTML=`<span class="swatch" style="background:${armColor(g.arm)}"></span> M${m} · ${g.arm}`;
    const box=document.createElement("div"); box.className="hbox";
    const base=document.createElement("img"); base.className="hbase"; base.src="assets/"+g.base;
    const over=document.createElement("img"); over.className="hover"; over.src="assets/"+g.overlay;
    over.style.opacity=elAlpha.value;
    const mark=document.createElement("div"); mark.className="hmark";
    box.append(base,over,mark); panel.append(lab,box); elGrid.append(panel);
    panels[m]={panel,box,base,over,mark,g};
  }
}
function placeMarker(gi){
  const mouse=M.mouse[gi];
  for(const m in panels){ panels[m].mark.style.display="none"; panels[m].panel.classList.remove("active"); }
  const p=panels[mouse]; if(!p) return;
  const g=p.g, ds=p.base.clientWidth/g.w;
  const cx=(M.x[gi]*g.scale - g.x0 + g.tp/2)*ds;
  const cy=(M.y[gi]*g.scale - g.y0 + g.tp/2)*ds;
  const sz=Math.max(12, g.tp*ds*1.8);
  p.mark.style.width=sz+"px"; p.mark.style.height=sz+"px";
  p.mark.style.left=(cx-sz/2)+"px"; p.mark.style.top=(cy-sz/2)+"px";
  p.mark.style.display="block"; p.panel.classList.add("active");
}
function showInfo(gi){
  lastGi=gi;
  atlasStyle(elPrev, gi, M, 150);
  const c=M.cluster[gi], mouse=M.mouse[gi];
  elInfo.innerHTML =
    `<div class="kv"><b>tile</b> ${M.tile_id[gi]}</div>`+
    `<div class="kv"><b>mouse</b> ${mouse}</div>`+
    `<div class="kv"><b>arm</b> <span class="swatch" style="background:${armColor(M.arms[gi])}"></span> ${M.arms[gi]}</div>`+
    `<div class="kv"><b>cluster</b> <span class="swatch" style="background:${clusterColor(c)}"></span> C${c}</div>`+
    `<div class="kv"><b>pos</b> (${M.x[gi]}, ${M.y[gi]})</div>`;
  placeMarker(gi);
}
(async()=>{
  M  = await loadJSON("assets/meta.json");
  HM = await loadJSON("assets/heatmaps.json");
  draw();
  buildHeatmaps();
  GD.on("plotly_hover", d=> showInfo(d.points[0].customdata));
  document.getElementById("mode").onchange = draw;
  document.getElementById("emb").onchange  = draw;
  elAlpha.oninput = ()=>{ for(const m in panels) panels[m].over.style.opacity=elAlpha.value; };
  window.addEventListener("resize", ()=>{ if(lastGi!=null) placeMarker(lastGi); });
  // images may finish loading after first paint; reposition the marker once they do
  for(const m in panels) panels[m].base.onload = ()=>{ if(lastGi!=null) placeMarker(lastGi); };
  // default: a central tile of mouse 365 (largest tumour) so the preview shows tissue
  let idx365=[]; for(let i=0;i<M.n;i++) if(M.mouse[i]==="365") idx365.push(i);
  showInfo(idx365.length ? idx365[Math.floor(idx365.length/2)] : 0);
})();
</script></body></html>
